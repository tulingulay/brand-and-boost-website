      content="Brand & Boost is een marketingpartner voor ambitieuze MKB-ondernemers. Geen uurtje-factuurtje, maar partnerschap, creativiteit en echte groei."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Brand & Boost" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:title" content="Brand & Boost · Meer dan marketing, een partner in groei." />
    <meta
      property="og:description"
      content="Marketingpartner voor ambitieuze MKB-ondernemers. Partnerschap, creativiteit en echte groei."
    />

    <!--ssr-meta-end-->

    <meta name="theme-color" content="#187DC1" />

    <!-- Fonts worden ge-selfhost via @fontsource (zie src/main.tsx); dat
         scheelt twee externe handshakes op het kritieke pad en er gaat
         geen bezoekersdata meer naar Google Fonts. -->
  </head>

    <div id="root"><!--app-html--></div>
