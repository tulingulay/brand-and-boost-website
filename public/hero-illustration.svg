<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" fill="none" role="img"
  aria-label="Illustratie: samen bouwen aan merkgroei">
  <!-- Decoratieve cirkels -->
  <circle cx="470" cy="90" r="46" fill="#D4A017" opacity="0.18" />
  <circle cx="80" cy="370" r="60" fill="#187DC1" opacity="0.12" />

  <!-- Schaduwkaart -->
  <rect x="92" y="96" width="404" height="300" rx="28" fill="#6E3F27" opacity="0.06" />
  <!-- Hoofdkaart -->
  <rect x="80" y="84" width="404" height="300" rx="28" fill="#FFFFFF" stroke="#E7DECF" stroke-width="2" />

  <!-- Basislijn -->
  <line x1="120" y1="332" x2="444" y2="332" stroke="#E7DECF" stroke-width="2" />

  <!-- Staven (oplopend = groei) -->
  <rect x="138" y="262" width="48" height="70" rx="10" fill="#187DC1" opacity="0.55" />
  <rect x="208" y="222" width="48" height="110" rx="10" fill="#187DC1" opacity="0.75" />
  <rect x="278" y="178" width="48" height="154" rx="10" fill="#D4A017" />
  <rect x="348" y="134" width="48" height="198" rx="10" fill="#187DC1" />

  <!-- Groeilijn met pijl -->
  <polyline points="150,250 232,214 300,176 384,132" fill="none" stroke="#2D2D2D" stroke-width="4"
    stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="150" cy="250" r="7" fill="#2D2D2D" />
  <circle cx="232" cy="214" r="7" fill="#2D2D2D" />
  <circle cx="300" cy="176" r="7" fill="#2D2D2D" />
  <path d="M372 116 L398 124 L382 146 Z" fill="#2D2D2D" />

  <!-- Klein tertiair detail (kastanje) -->
